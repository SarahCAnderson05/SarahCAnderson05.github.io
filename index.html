<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sarah Anderson</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: white;
      background: #111;
    }

    .hero {
      min-height: 100vh;
      background-image:
        linear-gradient(
          rgba(0, 0, 0, 0.28),
          rgba(0, 0, 0, 0.55)
        ),
        url("home-hero.jpg");
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 56px;
    }

    .nav {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .nav a {
      color: white;
      text-decoration: none;
      margin: 0 12px;
      border-bottom: none;
    }

    .nav a:hover {
      opacity: 0.75;
    }

    .slash {
      opacity: 0.7;
    }

    .intro {
      max-width: 720px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 64px;
      font-weight: 700;
      margin: 0 0 14px;
      letter-spacing: -1px;
    }

    p {
      font-size: 24px;
      line-height: 1.45;
      margin: 0;
      max-width: 680px;
    }

    .small {
      font-size: 16px;
      margin-top: 18px;
      opacity: 0.8;
    }

    @media (max-width: 700px) {
      .hero {
        padding: 34px 26px;
      }

      .nav {
        font-size: 22px;
        line-height: 1.8;
      }

      .nav a {
        margin: 0 6px;
      }

      h1 {
        font-size: 44px;
      }

      p {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <nav class="nav">
      <a href="me.html">me</a>
      <span class="slash">|</span>
      <a href="work.html">work</a>
      <span class="slash">|</span>
      <a href="notes.html">thoughts</a>
      <span class="slash">|</span>
      <a href="photos.html">pictures</a>
      <span class="slash">|</span>
      <a href="contact.html">talk to me!</a>
    </nav>

    <section class="intro">
      <h1>Sarah Anderson</h1>

      <p>
        aerospace engineering student, runner, pickler, musician, and person who likes figuring out how things work.
      </p>

      <p class="small">
        projects · research · running · photos · notes
      </p>
    </section>
  </main>
</body>
</html>
