<style>

.page {

}

}

p {

}

a {

</head>

<body>

<p class="intro">

<nav class="nav">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([39.8283, -98.5795], 4);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 18,
attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var places = [
{
name: "Alaska",
coords: [64.2008, -149.4937],
image: "photo-alaska.jpg",
caption: "September 2024."
},
{
name: "Utah",
coords: [39.3210, -111.0937],
image: "photo-utah.jpg",
caption: "2005-Present."
},
{
name: "Oregon",
coords: [43.8041, -120.5542],
image: "photo-oregon.jpg",
caption: "July 2022."
},
{
name: "San Diego",
coords: [32.7157, -117.1611],
image: "photo-san-diego.jpg",
caption: "2024-Present"
},
{
name: "Colorado",
coords: [39.5501, -105.7821],
image: "photo-colorado.jpg",
caption: "2020-Present"
},
{
name: "New Orleans / Gulf Shores",
coords: [30.1200, -89.2500],
image: "photo-gulf-coast.jpg",
caption: "2019, 2021, 2023"
},
{
name: "New York",
coords: [40.7128, -74.0060],
image: "photo-new-york.jpg",
caption: "2024, 2026"
},
{
name: "London",
coords: [51.5072, -0.1276],
image: "photo-london.jpg",
caption: "June 2024"
},
{
name: "Barcelona",
coords: [41.3874, 2.1686],
image: "photo-barcelona.jpg",
caption: "June 2024"
},
{
name: "Paris",
coords: [48.8566, 2.3522],
image: "photo-paris.jpg",
caption: "2022, 2024"
},
{
name: "Japan",
coords: [36.2048, 138.2529],
image: "photo-japan.jpg",
caption: "April 2024"
},
{
name: "Kansas",
coords: [38.5000, -98.0000],
image: "photo-kansas.jpg",
caption: "2015-Present"
},
{
name: "Honduras",
coords: [15.2000, -86.2419],
image: "photo-honduras.jpg",
caption: "May 2022"
}
];

places.forEach(function(place) {
L.marker(place.coords)
.addTo(map)
.bindPopup(
"<div class='popup-title'>" + place.name + "</div>" +
"<img class='popup-img' src='" + place.image + "' alt='" + place.name + " photo'>" +
"<div class='popup-caption'>" + place.caption + "</div>"
);
});
</script>
</body>
</html>
