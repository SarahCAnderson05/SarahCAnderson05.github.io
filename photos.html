<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>photos — Sarah Anderson</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
body {
margin: 0;
padding: 0;
background: #faf7f2;
color: #1f1f1f;
font-family: Georgia, "Times New Roman", serif;
line-height: 1.6;
}

.page {
max-width: 900px;
margin: 0 auto;
padding: 70px 24px;
}

h1 {
font-size: 44px;
font-weight: 400;
margin-bottom: 8px;
}

p {
font-size: 17px;
}

a {
color: #7a4e3a;
text-decoration: none;
border-bottom: 1px solid #c9a894;
}

a:hover {
color: #000;
border-bottom: 1px solid #000;
}

.nav {
margin: 24px 0 48px;
font-size: 17px;
}

.nav a {
margin-right: 18px;
}

.intro {
font-size: 22px;
max-width: 720px;
}

#map {
height: 560px;
width: 100%;
border: 1px solid #d8d0c7;
margin-top: 32px;
}

.popup-img {
width: 220px;
border-radius: 4px;
margin-top: 8px;
display: block;
}

.popup-title {
font-weight: bold;
font-size: 15px;
margin-bottom: 4px;
}

.popup-caption {
font-size: 13px;
line-height: 1.4;
margin-top: 6px;
}

footer {
margin-top: 70px;
padding-top: 24px;
border-top: 1px solid #d8d0c7;
color: #6d665f;
font-size: 14px;
}
</style>
</head>

<body>
<main class="page">
<h1>photos</h1>

<p class="intro">
a map of places i've ran, traveled, and things i've appreciated. 
</p>

<nav class="nav">
<a href="index.html">home</a>
<a href="me.html">me</a>
<a href="work.html">work</a>
<a href="notes.html">notes</a>
<a href="contact.html">contact</a>
</nav>

<div id="map"></div>

<footer>
<a href="index.html">back home</a>
</footer>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([39.8283, -98.5795], 4);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 18,
attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var places = [
{
name: "San Diego",
coords: [32.7157, -117.1611],
image: "photo-san-diego.jpg",
caption: "runs, school, projects, ocean, and small things i notice."
},
{
name: "Kansas City",
coords: [39.0997, -94.5786],
image: "photo-kansas-city.jpg",
caption: "home, running routes, music, and where a lot of things started."
},
{
name: "Torrey Pines",
coords: [32.9215, -117.2532],
image: "photo-torrey-pines.jpg",
caption: "trails, cliffs, ocean views, and places that make me want to take pictures."
}
];

places.forEach(function(place) {
L.marker(place.coords)
.addTo(map)
.bindPopup(
"<div class='popup-title'>" + place.name + "</div>" +
"<img class='popup-img' src='" + place.image + "' alt='" + place.name + " photo'>" +
"<div class='popup-caption'>" + place.caption + "</div>"
);
});
</script>
</body>
</html>
